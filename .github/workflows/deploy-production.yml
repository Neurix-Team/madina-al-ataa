name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: Publish
    timeout-minutes: 30

    steps:
      - name: Configure SSH password login
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y sshpass openssh-client

          SERVER_PORT="${SERVER_PORT:-22}"

          if [ -z "$SERVER_HOST" ]; then
            echo "SERVER_HOST secret is missing"
            exit 1
          fi

          if ! [[ "$SERVER_PORT" =~ ^[0-9]+$ ]]; then
            echo "SERVER_PORT must be a number"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy latest main on server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          SERVER_PORT="${SERVER_PORT:-22}"

          if [ -z "$SERVER_HOST" ]; then
            echo "SERVER_HOST secret is missing"
            exit 1
          fi

          if [ -z "$SERVER_USER" ]; then
            echo "SERVER_USER secret is missing"
            exit 1
          fi

          if [ -z "$SERVER_PASSWORD" ]; then
            echo "SERVER_PASSWORD secret is missing"
            exit 1
          fi

          if [ -z "$PROJECT_PATH" ]; then
            echo "PROJECT_PATH secret is missing"
            exit 1
          fi

          if ! [[ "$SERVER_PORT" =~ ^[0-9]+$ ]]; then
            echo "SERVER_PORT must be a number"
            exit 1
          fi

          PROJECT_PATH_B64="$(printf '%s' "$PROJECT_PATH" | base64 -w 0)"
          DEPLOY_SHA_B64="$(printf '%s' "$GITHUB_SHA" | base64 -w 0)"
          SERVER_PASSWORD_B64="$(printf '%s' "$SERVER_PASSWORD" | base64 -w 0)"

          echo "Connecting to $SERVER_USER@$SERVER_HOST on port $SERVER_PORT"
          echo "Project path: $PROJECT_PATH"

          SSHPASS="$SERVER_PASSWORD" sshpass -e ssh \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "PROJECT_PATH_B64='$PROJECT_PATH_B64' DEPLOY_SHA_B64='$DEPLOY_SHA_B64' SERVER_PASSWORD_B64='$SERVER_PASSWORD_B64' bash -s" <<'EOF'
          set -Eeuo pipefail

          PROJECT_PATH="$(printf '%s' "$PROJECT_PATH_B64" | base64 -d)"
          DEPLOY_SHA="$(printf '%s' "$DEPLOY_SHA_B64" | base64 -d)"
          SERVER_PASSWORD="$(printf '%s' "$SERVER_PASSWORD_B64" | base64 -d)"

          export PROJECT_PATH
          export DEPLOY_SHA

          echo "Logged in as: $(whoami)"
          echo "Validating sudo password..."

          echo "$SERVER_PASSWORD" | sudo -S -p '' -v

          echo "Switching to root using sudo -s..."

          sudo -E -s <<'ROOT_EOF'
          set -Eeuo pipefail

          echo "Running as: $(whoami)"
          echo "Deploying commit: $DEPLOY_SHA"
          cd "$PROJECT_PATH"
          echo "Fetching latest main..."
          git switch main
          git fetch
          git pull
          echo "Building Docker Images..."
          export CI=true
          export TERM=dumb
          export NO_COLOR=1
          export DOTNET_NOLOGO=1
          export DOTNET_CLI_TELEMETRY_OPTOUT=1

          aspire publish \
            --apphost ../GivingChampion.AppHost.csproj \
            --non-interactive \
            --nologo \
            -l Information \
            --pipeline-log-level information

          echo "Redepolying Docker Containers..."
          docker compose --env-file .env.production up -d
          echo "Deployment completed."
          ROOT_EOF
          EOF