name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "${{ secrets.SERVER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy latest main on server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${SERVER_PORT:-22}" \
              "$SERVER_USER@$SERVER_HOST" \
              "PROJECT_PATH='$PROJECT_PATH' DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'EOF'
          set -Eeuo pipefail

          echo "Deploying commit: $DEPLOY_SHA"

          cd "$PROJECT_PATH"

          echo "Fetching latest main..."
          git switch main
          git fetch
          git pull

          echo "Building Docker Images..."
          aspire do prepare-compose --environment production
          echo "ReDepolying Docker Containers..."
          docker compose --env-file .env.production down
          docker compose --env-file .env.production up -d

          echo "Deployment completed."
          EOF